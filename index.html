<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogTech</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>BlogTech - CEEPA</h1>
        <p>Blog do Sene</p>
    </header>
    <main>
        <img src="tartaruga.png"
            alt="Descrição Curta
A imagem captura um cenário marinho vivo, colorido e iluminado de cima para baixo por raios de sol que atravessam a água azul-clara.
Uma imagem subaquática vibrante de um recife de corais sob a luz do sol. No centro, uma grande tartaruga-marinha nada calmamente. Ao redor dela, há vários peixes-palhaço (laranjas e brancos), cirurgiões-patela (azuis) e uma arraia ao fundo.">


        <div>
            <h2>Vida marinha e suas curiosidades.</h2>
            <p class="autor">Por Vitor Sene</p>
            <p>Algumas coisas sobre a vida no mar </p>
            <button>👍<span>0</span></button>
            <button>👎<span>0</span></button>
        </div>
    </main>
    <footer>
        <p>Por: Vitor Sene</p>
    </footer>
</body>
<script>
    const botoes = document.querySelectorAll("button");

    botoes.forEach(function (botao) {
        let curtiu = false;
        botao.addEventListener("click", botaoClicado);
        function botaoClicado() {
            console.log("fui clicado");
            let texto = botao.querySelector("span");
            if (curtiu === false) {
                texto.textContent++;
                curtiu = true;
            } else {
                texto.textContent--;
                curtiu = false;
            }
        }
    })

</script>

</html>s
